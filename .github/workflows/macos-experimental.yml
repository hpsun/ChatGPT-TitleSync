name: Experimental macOS compile and rule tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experimental-compile:
    name: Experimental compile - ${{ matrix.language }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [swift, objective-c, rust, go]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version: '1.27.3'
          cache: false
      - name: Select Rust through official rustup
        if: matrix.language == 'rust'
        run: rustup toolchain install 1.82.0 --profile minimal
      - name: Record native compiler and SDK versions
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swiftc --version
          clang --version
      - name: Compile only - never launch the AX monitor
        shell: bash
        env:
          TITLE_BUILD_LANGUAGE: ${{ matrix.language }}
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          bash shared/macos/build.sh "$RUNNER_TEMP"
          case "$TITLE_BUILD_LANGUAGE" in
            swift)
              clang -fobjc-arc -fblocks -c shared/macos/RulesClient.m -o "$RUNNER_TEMP/RulesClient.o"
              swiftc macos/ChatGPTWindowTitles.swift "$RUNNER_TEMP/RulesClient.o" -import-objc-header shared/macos/RulesClient.h -framework AppKit -framework ApplicationServices -o "$RUNNER_TEMP/chatgpt-titlesync-swift"
              ;;
            objective-c)
              clang -fobjc-arc -fblocks -framework Cocoa -framework ApplicationServices macos/ChatGPTWindowTitles.m shared/macos/RulesClient.m -o "$RUNNER_TEMP/chatgpt-titlesync-objc"
              ;;
            rust)
              cargo +1.82.0 build --manifest-path rust/Cargo.toml --release --offline
              ;;
            go)
              (cd go && CGO_ENABLED=1 go build -trimpath -o "$RUNNER_TEMP/chatgpt-titlesync-go" .)
              ;;
          esac
      - name: Verify Unicode name rules without UI or AX
        if: ${{ always() && matrix.language == 'swift' }}
        run: python3 tools/test_name_replacement.py --worker "$RUNNER_TEMP/chatgpt-titlesync-rules" --report "$RUNNER_TEMP/name-rules-report.json"
      - name: Verify bounded rule-file I/O without UI or AX
        if: ${{ always() && matrix.language == 'swift' }}
        run: python3 tools/test_macos_name_rules_io.py --helper "$RUNNER_TEMP/chatgpt-titlesync-rules" --output "$RUNNER_TEMP/name-rules-io.json"
      - name: Verify raw-name client recovery without UI or AX
        if: ${{ always() && matrix.language == 'swift' }}
        run: |
          clang -fobjc-arc -fblocks -framework Foundation tools/tests/macos_rules_client_fixture.m shared/macos/RulesClient.m -o "$RUNNER_TEMP/rules-client-fixture"
          "$RUNNER_TEMP/rules-client-fixture" "$RUNNER_TEMP/chatgpt-titlesync-rules"
      - name: Compile the shared menu script without launching it
        id: applescript_compile
        if: ${{ always() && matrix.language == 'swift' }}
        run: osacompile -o "$RUNNER_TEMP/TitleSyncTray.scpt" macos/TraySettings.applescript
      - name: Diagnose a failed AppleScript compile without executing it
        if: ${{ always() && matrix.language == 'swift' && steps.applescript_compile.outcome == 'failure' }}
        shell: bash
        run: swift tools/diagnose-applescript.swift macos/TraySettings.applescript
